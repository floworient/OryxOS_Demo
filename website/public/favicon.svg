<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">OryxOS logo</title>
  <desc id="desc">A blue geometric oryx head inside a connected Agent runtime ring.</desc>

  <defs>
    <linearGradient id="background" x1="34" y1="24" x2="222" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B2F5B"/>
      <stop offset="0.55" stop-color="#071D3A"/>
      <stop offset="1" stop-color="#041225"/>
    </linearGradient>
    <linearGradient id="horn" x1="128" y1="18" x2="128" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="0.48" stop-color="#3B82F6"/>
